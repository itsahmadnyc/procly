name: Feature request
description: An idea that would make procly better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The problem first. What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working, if you have an idea. Examples from PM2 or other tools are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
