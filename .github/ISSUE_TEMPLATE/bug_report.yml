name: Bug report
description: Something doesn't work the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: procly version
      description: The output of `procly version`.
      placeholder: "0.3.0"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where it happens
      multiple: true
      options:
        - CLI
        - Daemon (processes, restarts, logs)
        - Terminal dashboard (procly monit)
        - Web panel
        - Agent / multiple servers
        - Install (curl, npm, go install)
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: OS and architecture
      placeholder: Ubuntu 24.04, arm64
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Command output, `procly describe <name>`, or the panel's Events tab. Remove anything private.
      render: shell
