name: Release

# Push a tag like v0.4.0 and this builds the four archives and checksums.txt
# with scripts/release.sh and publishes the GitHub release, with the notes
# from CHANGELOG.md. npm stays manual (it needs 2FA): see CONTRIBUTING.md.
#
# Run it by hand from the Actions tab (or `gh workflow run release.yml`) for a
# dry run: the same build and checks, nothing published; the files are kept as
# a workflow artifact for a week.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the release and upload its files
    env:
      PUBLISH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check the tag
        if: env.PUBLISH == 'true'
        run: |
          case "$GITHUB_REF_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::$GITHUB_REF_NAME is not a version tag like v1.2.3"; exit 1 ;;
          esac
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main; releases are cut from main"
            exit 1
          fi

      - name: Work out the version
        run: |
          if [ "$PUBLISH" = true ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dryrun" >> "$GITHUB_ENV"
          fi

      - name: Test
        run: |
          go vet ./...
          go test -race -count=1 ./...

      - name: Build the archives
        run: scripts/release.sh "$VERSION"

      - name: Write the release notes
        run: |
          if [ "$PUBLISH" = true ]; then
            scripts/release-notes.sh "$VERSION" > notes.md
          else
            scripts/release-notes.sh latest > notes.md
          fi
          cat notes.md

      - name: Check the archives
        run: |
          cd dist
          shasum -a 256 -c checksums.txt
          for f in procly_darwin_amd64.tar.gz procly_darwin_arm64.tar.gz procly_linux_amd64.tar.gz procly_linux_arm64.tar.gz; do
            tar -tzf "$f" | grep -qx "${f%.tar.gz}/procly" || { echo "::error::$f has no ${f%.tar.gz}/procly"; exit 1; }
          done
          tar -xzf procly_linux_amd64.tar.gz -C "$RUNNER_TEMP"
          got=$("$RUNNER_TEMP/procly_linux_amd64/procly" version)
          [ "$got" = "procly $VERSION" ] || { echo "::error::the binary says '$got', expected 'procly $VERSION'"; exit 1; }

      - name: Publish the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          # A re-run after a partial failure updates the release instead of failing.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz dist/checksums.txt --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/*.tar.gz dist/checksums.txt \
              --title "procly $TAG" --notes-file notes.md --verify-tag $prerelease
          fi

      - name: Keep the files (dry run)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: |
            dist/*.tar.gz
            dist/checksums.txt
            notes.md
          retention-days: 7
